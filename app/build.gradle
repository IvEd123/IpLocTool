plugins { id 'com.android.application' }

android {
    namespace 'ru.ivedam.iploctool'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.ivedam.iploctool'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 23
        targetSdk 35
        versionCode providers.gradleProperty('versionCode').getOrElse('1').toInteger()
        versionName providers.gradleProperty('versionName').getOrElse('1.0.0')
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('IPLOC_KEYSTORE') ?: '../unused.keystore')
            storePassword System.getenv('IPLOC_STORE_PASSWORD')
            keyAlias System.getenv('IPLOC_KEY_ALIAS')
            keyPassword System.getenv('IPLOC_KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig System.getenv('IPLOC_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError true }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
